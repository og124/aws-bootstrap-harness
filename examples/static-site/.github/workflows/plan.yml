# Pull requests: fmt, validate, and a plan posted as a PR comment, using the
# read-only plan role. Repository variables (Settings -> Variables):
#   AWS_REGION, TF_STATE_BUCKET, PLAN_ROLE_ARN, APPLY_ROLE_ARN,
#   TF_VAR_DOMAIN_NAME, TF_VAR_ZONE_NAME, TF_VAR_OIDC_PROVIDER_ARN,
#   TF_VAR_ALERT_EMAIL (without it the breaker trips silently)
name: plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write      # OIDC
  contents: read
  pull-requests: write # the plan comment

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
  TF_VAR_zone_name: ${{ vars.TF_VAR_ZONE_NAME }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_oidc_provider_arn: ${{ vars.TF_VAR_OIDC_PROVIDER_ARN }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_alert_email: ${{ vars.TF_VAR_ALERT_EMAIL }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform validate -no-color
      - run: terraform plan -no-color -lock=false | tee plan.txt

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always()
        with:
          script: |
            const fs = require('fs');
            let plan = 'No plan output — an earlier step failed.';
            try { plan = fs.readFileSync('plan.txt', 'utf8'); } catch {}
            if (plan.length > 60000) plan = '…truncated…\n' + plan.slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '#### Terraform plan\n<details><summary>Show</summary>\n\n```terraform\n' + plan + '\n```\n</details>',
            });
