name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Offline only: fmt and validate need no AWS credentials. The example exercises
# all three modules.
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - name: validate
        run: |
          for d in bootstrap examples/static-site; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
          done
      - name: breaker Lambda parses
        run: node --check modules/cost-breaker/lambda/index.mjs
